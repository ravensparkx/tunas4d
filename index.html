  <style amp-custom>
    :root {
      --bg-dark: #0b0508;
      --panel-dark: #0a1712;
      --primary-green: #ff0099;
      --secondary-green: #b3006e;
      --accent-gold: #ffb700;
      --accent-blue: #00d9ff;
      --text-main: #e6f7f0;
      --text-muted: #b380a9;
      --border-glow: rgba(255, 0, 212, 0.35);
    }

    * { box-sizing: border-box; }

    html { background: var(--bg-dark); }

    body {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 20px 10px calc(20px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      color: var(--text-main);
      background: radial-gradient(circle at 50% 0%, #2b0d1e 0%, #0b0508 75%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 80% 20%, rgba(255, 0, 238, 0.08), transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(255, 0, 179, 0.06), transparent 40%);
    }

    .nx-stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .nx-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: rgba(23, 10, 20, 0.95);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(255, 0, 191, 0.15);
    }

    .nx-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(255, 0, 208, 0.05);
      border-bottom: 1px solid rgba(255, 0, 179, 0.15);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nx-badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-green);
    }

    .nx-badge-live::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--primary-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary-green);
      animation: pulseGreen 1.5s infinite;
    }

    .nx-body {
      padding: 20px 18px;
    }

    .nx-logo-wrap {
      width: 100%;
      max-width: 200px;
      margin: 0 auto 14px;
    }

    .nx-title-tag {
      margin: 0 0 16px;
      color: var(--accent-gold);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: center;
      text-transform: uppercase;
    }

    .nx-banner {
      position: relative;
      padding: 4px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 0, 208, 0.4), rgba(255, 0, 183, 0.1));
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .nx-banner-img {
      border-radius: 10px;
      overflow: hidden;
      display: block;
    }

    .nx-tags-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0;
    }

    .nx-tag-item {
      padding: 8px 4px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 0, 179, 0.15);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nx-btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nx-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 16px;
      color: #0b0508;
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 10px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .nx-btn-login {
      background: linear-gradient(90deg, #00d9ff, #0088ff);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 0, 170, 0.3);
    }

    .nx-btn-register {
      background: linear-gradient(90deg, var(--primary-green), var(--secondary-green));
      color: #0b0508;
      box-shadow: 0 4px 15px rgba(255, 0, 191, 0.3);
    }

    .nx-btn-alt {
      background: linear-gradient(90deg, var(--accent-gold), #ff8800);
      color: #0b0508;
      box-shadow: 0 4px 15px rgba(255, 183, 0, 0.3);
    }

    .nx-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .nx-footer {
      padding: 14px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid rgba(255, 0, 200, 0.1);
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .typing-box {
      display: inline-flex;
      align-items: center;
    }

    .typing-text {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid var(--primary-green);
      width: 0;
      color: var(--primary-green);
      animation: typeAndDelete 6s steps(13, end) infinite, blinkCursor 0.75s step-end infinite;
    }

    /* Animasi Curtain Opening (Beda gaya: Zoom Out & Fade Reveal) */
    .nx-intro {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      animation: fadeOutIntro 0.6s ease 2s forwards;
      pointer-events: none;
    }

    .nx-intro-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-green);
      letter-spacing: 3px;
      text-shadow: 0 0 20px var(--primary-green);
      animation: zoomIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseGreen {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes typeAndDelete {
      0% { width: 0; }
      35%, 45% { width: 13ch; }
      80%, 90% { width: 0; }
      100% { width: 0; }
    }

    @keyframes blinkCursor {
      from, to { border-color: transparent; }
      50% { border-color: var(--primary-green); }
    }

    @keyframes zoomIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeOutIntro {
      to { opacity: 0; visibility: hidden; }
    }

    @media(max-width: 480px) {
      .nx-body { padding: 14px; }
      .nx-btn { min-height: 48px; font-size: 12px; }
    }
  </style>
</head>
